<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220">
  <!-- Dead Haven: Merge & Survive - monochrome logo. Single flat colour via
       currentColor so it can be recoloured by whatever places it (print,
       watermarks, a single-colour Android adaptive-icon layer, favicons).
       The mark is simplified to a rounded panel with the doorway and its
       boards cut out as true negative space (mask), rather than the full
       gradient/glow illustration - a monochrome mark needs to read as a
       flat silhouette, not a flattened colour picture. -->
  <defs>
    <mask id="m_cutout" maskUnits="userSpaceOnUse" x="18" y="30" width="128" height="128">
      <rect x="18" y="30" width="128" height="128" fill="#ffffff"/>
      <rect x="58" y="60" width="48" height="76" fill="#000000"/>
      <g stroke="#ffffff" stroke-width="7" stroke-linecap="round">
        <line x1="58" y1="76" x2="98" y2="72"/>
        <line x1="58" y1="94" x2="98" y2="91"/>
        <line x1="58" y1="112" x2="98" y2="110"/>
        <line x1="58" y1="128" x2="98" y2="127"/>
      </g>
    </mask>
  </defs>

  <rect x="18" y="30" width="128" height="128" rx="14" fill="currentColor" mask="url(#m_cutout)"/>

  <g transform="translate(232,0)">
    <text x="0" y="98" font-family="'Arial Black','Arial',sans-serif" font-weight="900"
          font-size="76" letter-spacing="2" fill="currentColor" transform="scale(0.92,1)">DEAD HAVEN</text>
    <rect x="2" y="112" width="420" height="6" fill="currentColor"/>
    <text x="2" y="152" font-family="Arial,sans-serif" font-weight="600"
          font-size="30" letter-spacing="7" fill="currentColor" opacity="0.75">MERGE &amp; SURVIVE</text>
  </g>
</svg>
