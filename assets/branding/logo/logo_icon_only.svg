<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Dead Haven: Merge & Survive - icon-only mark. Same boarded-doorway
       motif as icon.svg (the actual Godot launcher icon at repo root),
       duplicated here as the standalone brand mark so logo compositions
       don't need to reference outside assets/branding/. Keep both files
       visually identical if either changes. -->
