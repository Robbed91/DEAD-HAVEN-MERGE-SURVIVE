<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220">
  <!-- Dead Haven: Merge & Survive - full horizontal logo, dark-background
       version (for the main menu, splash screen, and any dark UI chrome).
       Mark (boarded doorway, see logo_icon_only.svg) on the left, wordmark
       stack on the right: distressed condensed "DEAD HAVEN" over a clean
       "MERGE & SURVIVE" subtitle, tied together with a hand-nailed board
       accent under the wordmark echoing the mark's boards. -->
  <defs>
    <radialGradient id="h_glow" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#f4dfa1" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#e2a24a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e2a24a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232a30"/>
      <stop offset="100%" stop-color="#171615"/>
    </linearGradient>
    <filter id="h_rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2"/>
    </filter>
  </defs>

  <!-- transparent canvas - compose over the game's charcoal chrome -->

  <!-- mark, scaled/positioned into the left third -->
  <g transform="translate(18,30) scale(1.25)">
    <rect width="128" height="128" rx="14" fill="url(#h_sky)"/>
    <rect x="0" y="104" width="128" height="24" fill="#141311"/>
    <ellipse cx="64" cy="70" rx="52" ry="58" fill="url(#h_glow)"/>
    <rect x="40" y="30" width="48" height="76" rx="2" fill="#4a3527"/>
    <rect x="44" y="34" width="40" height="72" fill="#12100e"/>
    <g stroke="#8f4a26" stroke-width="7" stroke-linecap="round">
      <line x1="44" y1="46" x2="84" y2="42"/>
      <line x1="44" y1="64" x2="84" y2="61"/>
      <line x1="44" y1="82" x2="84" y2="80"/>
      <line x1="44" y1="98" x2="84" y2="97"/>
    </g>
    <g fill="#f6e2ab" opacity="0.85">
      <rect x="46" y="52" width="34" height="4" rx="1"/>
      <rect x="46" y="70" width="34" height="4" rx="1"/>
      <rect x="46" y="88" width="34" height="4" rx="1"/>
    </g>
    <g fill="#3c4650">
      <ellipse cx="103" cy="66" rx="6.5" ry="7.5"/>
      <path d="M94 108 C93 90 96 80 103 76 C110 80 113 90 112 108 Z"/>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(232,0)">
    <text x="0" y="98" font-family="'Arial Black','Arial',sans-serif" font-weight="900"
          font-size="76" letter-spacing="2" fill="#e8dcc5" transform="scale(0.92,1)"
          filter="url(#h_rough)">DEAD HAVEN</text>
    <!-- thin rust warning underline standing in for a hazard-stripe accent -->
    <rect x="2" y="112" width="420" height="6" fill="#b5502b"/>
    <rect x="2" y="112" width="60" height="6" fill="#e8dcc5" opacity="0.85"/>
    <rect x="130" y="112" width="60" height="6" fill="#e8dcc5" opacity="0.85"/>
    <rect x="300" y="112" width="60" height="6" fill="#e8dcc5" opacity="0.85"/>
    <text x="2" y="152" font-family="Arial,sans-serif" font-weight="600"
          font-size="30" letter-spacing="7" fill="#cf6a3f">MERGE &amp; SURVIVE</text>
  </g>
</svg>
